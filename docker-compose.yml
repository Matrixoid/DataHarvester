services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: harvester_rabbitmq
    environment:
      RABBITMQ_USER: ${RMQ_USER}
      RABBITMQ_PASSWORD: ${RMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"

  postgres:
    image: postgres:15-alpine
    container_name: harvester_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 3s
      timeout: 3s
      retries: 5

  orchestrator:
    build:
      context: .
      dockerfile: DataHarvester.Orchestrator/Dockerfile
    container_name: harvester_orchestrator
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RMQ_USER}
      - RabbitMQ__Password=${RMQ_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: DataHarvester.Worker/Dockerfile
    container_name: harvester_worker
    environment:
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RMQ_USER}
      - RabbitMQ__Password=${RMQ_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_started